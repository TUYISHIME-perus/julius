<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="church-logo.jpg" type="image/jpeg">
    <title>Worshipping program</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0 24px 24px;
            background: #f2f5f1;
            color: #20312e;
            font-family: Arial, sans-serif;
        }
        .site-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px 24px;
            margin: 0 -24px 24px;
            padding: 10px 20px;
            background: rgb(23, 13, 110);
        }
        .site-brand {
            margin: 0;
            color: white;
            text-align: center;
            font-size: 1.15rem;
        }
        .brand-lockup {
            display: flex;
            flex: 0 1 auto;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
        }
        .site-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 4px 20px;
        }
        .site-logo {
            display: block;
            width: 64px;
            height: 64px;
            flex: 0 0 64px;
            border-radius: 50%;
            object-fit: contain;
            background: #000;
        }
        .site-nav a {
            color: white;
            text-decoration: none;
            padding: 8px 4px;
        }
        @media (max-width: 760px) {
            .site-nav {
                justify-content: flex-start;
                padding: 10px 14px;
            }
            .site-links {
                justify-content: flex-start;
                width: 100%;
                gap: 4px 16px;
            }
        }
        section {
            width: min(100%, 1100px);
            margin: 0 auto;
            padding: 28px;
            background-color: #56b3ca;
        }
        h1 {
            text-align: center;
            font-size: 1.25rem;
            color: #173f56;
            margin: 0 0 24px;
        }
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
            padding: 16px;
            background: #fff;
        }
        label {
            display: grid;
            gap: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            min-height: 42px;
            padding: 9px 10px;
            border: 1px solid #aab9b6;
            border-radius: 3px;
            font: inherit;
        }
        .table-wrap {
            overflow-x: auto;
            background: #fff;
        }
        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }
        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #c7d5ce;
            text-align: left;
            overflow-wrap: anywhere;
        }
        th {
            background: #d8e8df;
        }
        #message {
            margin: 16px 0 0;
        }
        #message.error {
            color: #8b1e16;
        }
        @media (max-width: 480px) {
            body {
                padding: 0 12px 12px;
            }
            .site-nav {
                margin: 0 -12px 16px;
                gap: 4px 12px;
                padding: 10px;
            }
            section {
                padding: 20px 14px;
            }
            .filters {
                grid-template-columns: minmax(0, 1fr);
                padding: 12px;
            }
            th,
            td {
                padding: 9px;
            }
        }
    </style>
</head>
<body>
    <nav class="site-nav" aria-label="Main navigation">
        <div class="brand-lockup">
            <img class="site-logo" src="church-logo.jpg" alt="Seventh-day Adventist logo">
            <h2 class="site-brand">ESTG SDA church programs</h2>
        </div>
        <div class="site-links">
            <a href="index.html">Home</a>
            <a href="morning.html">Morning program</a>
            <a href="school sabbath.html">Sabbath School</a>
            <a href="admin.html" aria-current="page">Preachers</a>
            <a href="https://www.academia.edu/123429509/Indirimbo_Zo_Guhimbaza_Imana_za_500_SDA_Church_500_" target="_blank" rel="noopener noreferrer">Songs of praise of God</a>
            <a href="https://bibiliya.com/" target="_blank" rel="noopener noreferrer">Holy bible</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>
    <section>
        <h1>Worshipping program</h1>
        <div class="filters" aria-label="Search worshipping programs">
            <label for="date-filter">Search by date
                <input id="date-filter" type="date">
            </label>
            <label for="preacher-filter">Search by preacher
                <input id="preacher-filter" type="search" placeholder="Enter preacher name">
            </label>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Leader</th>
                        <th scope="col">Lesson reader</th>
                        <th scope="col">Preacher</th>
                        <th scope="col">Book reader</th>
                        <th scope="col">Last pray</th>
                        <th scope="col">Receiver</th>
                        <th scope="col">Choir</th>
                        <th scope="col">Date</th>
                    </tr>
                </thead>
                <tbody id="program-rows"></tbody>
            </table>
        </div>
        <p id="message" aria-live="polite">Loading worshipping programs...</p>
    </section>
    <script>
        const storageKey = "morningProgramDashboard";
        const fields = ["leader", "lessonReader", "preacher", "bookReader", "lastPray", "receiver", "choir", "date"];
        const rows = document.getElementById("program-rows");
        const message = document.getElementById("message");
        const dateFilter = document.getElementById("date-filter");
        const preacherFilter = document.getElementById("preacher-filter");
        let programs = [];

        function loadPrograms() {
            try {
                const saved = localStorage.getItem(storageKey);
                if (!saved) {
                    programs = [];
                    renderPrograms();
                    return;
                }
                const dashboard = JSON.parse(saved);
                const entries = dashboard && dashboard.data && Array.isArray(dashboard.data.worship)
                    ? dashboard.data.worship
                    : [];
                programs = entries.filter(program =>
                    program && typeof program === "object" &&
                    fields.every(field => typeof program[field] === "string")
                );
                renderPrograms();
            } catch (error) {
                programs = [];
                rows.replaceChildren();
                message.className = "error";
                message.textContent = "Unable to read saved worshipping programs. Check browser storage and dashboard data, then reload this page.";
            }
        }

        function renderPrograms() {
            const date = dateFilter.value;
            const preacher = preacherFilter.value.trim().toLowerCase();
            const matches = programs
                .filter(program => !date || program.date === date)
                .filter(program => !preacher || program.preacher.toLowerCase().includes(preacher))
                .sort((a, b) => a.date.localeCompare(b.date));

            rows.replaceChildren();
            matches.forEach(program => {
                const row = document.createElement("tr");
                fields.forEach(field => {
                    const cell = document.createElement("td");
                    cell.textContent = program[field];
                    row.appendChild(cell);
                });
                rows.appendChild(row);
            });

            message.className = "";
            message.textContent = matches.length
                ? matches.length + (matches.length === 1 ? " worshipping program" : " worshipping programs")
                : programs.length
                    ? "No worshipping programs match your search."
                    : "No worshipping programs have been added in the dashboard yet.";
        }

        dateFilter.addEventListener("input", renderPrograms);
        preacherFilter.addEventListener("input", renderPrograms);
        window.addEventListener("storage", event => {
            if (event.key === storageKey || event.key === null) loadPrograms();
        });

        loadPrograms();
    </script>
</body>
</html>
