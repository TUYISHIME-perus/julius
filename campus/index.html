<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="church-logo.jpg" type="image/jpeg">
    <title>ESTG SDA church programs</title>
</head>
<body>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
        }
        nav{
            background-color: rgb(23, 13, 110);
            width:100%;
            border-bottom: solid 1px rgb(85, 85, 92);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px 24px;
            padding: 10px 20px;
            top: 0;
            position: sticky;
            z-index: 1000;
        }
        nav a{
            text-align: center;
            text-decoration: none;
            color: white;
            padding: 8px 4px;
        }
        .brand-lockup{
            display: flex;
            flex: 0 1 auto;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
        }
        .site-links{
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 4px 20px;
        }
        .site-logo{
            display: block;
            width: 64px;
            height: 64px;
            flex: 0 0 64px;
            border-radius: 50%;
            object-fit: contain;
            background: #000;
        }
        .site-brand{
            margin: 0;
            color: #fff;
            text-align: center;
            font-size: 1.15rem;
        }
        section{
            height: clamp(320px, 65vh, 500px);
            width: 100%;
            background-color: rgb(61, 193, 202);
            visibility: visible;
            padding: 0;
            
            background-repeat: no-repeat;
            background-size: cover;
            
            
        }
       .home{
            height: 100%;
          width: 100%;
             position: relative;
            visibility: visible;
          padding: 0;
       }
         .photo-window{
             position: absolute;
             inset: 0;
             overflow: hidden;
         }
         .photo-track{
             display: flex;
             height: 100%;
             width: 100%;
             transition: transform 1s ease;
         }
         .photo-window[hidden]{
             display: none;
         }
         .home h2,
         .home p{
             z-index: 1;
         }
         .home h2{
             position: absolute;
             top: 50%;
             left: 50%;
             width: 100%;
             margin: 0;
             color: white;
             text-align: center;
             transform: translate(-50%, -50%);
         }
         .home p{
             position: absolute;
             top: 65%;
             left: 20px;
             max-width: calc(100% - 40px);
             color: white;
             font-size: 20px;
             z-index: 1;
             white-space: nowrap;
             overflow: hidden;
             text-overflow: ellipsis;
             animation: slide-message-right 8s ease-in-out forwards;
         }
         @keyframes slide-message-right{
             0%, 65%{
                 left: 20px;
                 transform: translateX(0);
             }
             100%{
                 left: 100%;
                 transform: translateX(-100%);
             }
         }
       .home img{
          display: block;
             flex: 0 0 100%;
          height: 100%;
          width: 100%;
          object-fit: cover;
       }     
       .home .photo-track video{
          display: block;
          flex: 0 0 100%;
          height: 100%;
          width: 100%;
          object-fit: contain;
          background: #111;
       }
       .home .media-error{
          position: absolute;
          z-index: 2;
          right: 12px;
          bottom: 8px;
          max-width: calc(100% - 24px);
          margin: 0;
          padding: 8px 12px;
          color: #8b1e16;
          background: #fff;
          white-space: normal;
       }
      footer{
            background-color: rgb(3, 3, 3);
            height:60px;
            width:100%;
            padding: 0%;
            margin-top: 0;
            
      }
      @media (max-width: 1100px){
          nav{
              height: auto;
              justify-content: flex-start;
              padding: 10px 14px;
          }
          .site-links{
              justify-content: flex-start;
              width: 100%;
              gap: 4px 16px;
          }
          section{
              width: 100%;
          }
          .home h2{
              padding: 0 14px;
              font-size: clamp(1.25rem, 5vw, 2rem);
          }
          .home p{
              top: 68%;
              left: 12px;
              max-width: calc(100% - 24px);
              font-size: clamp(16px, 4vw, 20px);
          }
      }
      @media (max-width: 380px){
          nav{
              gap: 4px 10px;
              padding-inline: 8px;
          }
          .site-links a{
              font-size: .9rem;
          }
          section{
              height: 320px;
          }
          footer p{
              font-size: .85rem;
          }
      }
    </style>
    <nav class="site-nav" aria-label="Main navigation">
        <div class="brand-lockup">
            <img class="site-logo" src="church-logo.jpg" alt="Seventh-day Adventist logo">
            <h3 class="site-brand">ESTG SDA church programs</h3>
        </div>
        <div class="site-links">
            <a href="index.html" aria-current="page">Home</a>
            <a href="morning.html">Morning program</a>
            <a href="school sabbath.html">Sabbath School</a>
            <a href="preachers.html">Preachers</a>
            <a href="https://www.academia.edu/123429509/Indirimbo_Zo_Guhimbaza_Imana_za_500_SDA_Church_500_" target="_blank" rel="noopener noreferrer">Songs of praise of God</a>
            <a href="https://bibiliya.com/" target="_blank" rel="noopener noreferrer">Holy bible</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>
    <section>
        <div class="home">
        <h2>Welcome to ESTG SDA church program</h2>
        <p id="home-message" aria-live="polite" hidden></p>
        <p class="media-error" id="media-error" role="status" hidden></p>
        <div class="photo-window" id="photo-window" hidden>
        <div class="photo-track">
        </div>
        </div>
    </section>
    <footer>
        
           <p style="color: white; text-align: center; padding: 15px;">all right reserved@2026</p>  
    
    </footer>
    <script>
        const messageKey = "morningProgramDashboard";
        const messageElement = document.getElementById("home-message");
        let homeMessages = [];
        let messageIndex = 0;
        let nextMessageTimer;

        function displayHomeMessage() {
            window.clearTimeout(nextMessageTimer);
            const message = homeMessages[messageIndex];
            if (!message) {
                messageElement.hidden = true;
                return;
            }

            messageElement.textContent = message;
            messageElement.hidden = false;
            messageElement.style.animation = "none";
            requestAnimationFrame(() => {
                messageElement.style.animation = "";
            });
            nextMessageTimer = window.setTimeout(() => {
                messageIndex = (messageIndex + 1) % homeMessages.length;
                displayHomeMessage();
            }, 8000);
        }

        function loadHomeMessages() {
            try {
                const saved = localStorage.getItem(messageKey);
                const dashboard = saved ? JSON.parse(saved) : null;
                const messages = dashboard && Array.isArray(dashboard.homeMessages)
                    ? dashboard.homeMessages
                    : [];
                homeMessages = messages
                    .filter(message => typeof message === "string")
                    .map(message => message.trim())
                    .filter(Boolean);
                messageIndex = 0;
                displayHomeMessage();
            } catch (error) {
                homeMessages = [];
                messageElement.hidden = true;
            }
        }

        window.addEventListener("storage", event => {
            if (event.key === messageKey || event.key === null) {
                loadHomeMessages();
                loadHomePhotos();
            } else if (event.key === "campusHomeMediaUpdated") {
                loadHomePhotos();
            }
        });
        loadHomeMessages();

        const photoWindow = document.getElementById("photo-window");
        const imageTrack = document.querySelector(".photo-track");
        const mediaError = document.getElementById("media-error");
        let slideIndex = 0;
        let slideTimer;
        let slideResetTimer;
        let homeVideoUrl = "";

        function openMediaDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("campusHomeMedia", 1);
                request.onupgradeneeded = () => request.result.createObjectStore("assets");
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(new Error("Unable to open browser media storage."));
            });
        }

        async function readHomeVideo() {
            const database = await openMediaDatabase();
            return new Promise((resolve, reject) => {
                const request = database.transaction("assets", "readonly").objectStore("assets").get("homeVideo");
                request.onsuccess = () => {
                    database.close();
                    resolve(request.result || null);
                };
                request.onerror = () => {
                    database.close();
                    reject(new Error("Unable to load the home video from browser storage."));
                };
            });
        }

        async function loadHomePhotos() {
            window.clearInterval(slideTimer);
            window.clearTimeout(slideResetTimer);
            const oldVideo = imageTrack.querySelector("video");
            if (oldVideo) {
                oldVideo.pause();
                oldVideo.removeAttribute("src");
                oldVideo.load();
            }
            imageTrack.replaceChildren();
            imageTrack.style.transition = "";
            imageTrack.style.transform = "translateX(0)";
            slideIndex = 0;
            mediaError.hidden = true;

            try {
                const saved = localStorage.getItem(messageKey);
                const dashboard = saved ? JSON.parse(saved) : null;
                const photos = dashboard && Array.isArray(dashboard.homePhotos)
                    ? dashboard.homePhotos.filter(photo => typeof photo === "string" && photo.startsWith("data:image/"))
                    : [];
                photos.forEach((photo, index) => {
                    const image = document.createElement("img");
                    image.src = photo;
                    image.alt = "Home photo " + (index + 1);
                    imageTrack.appendChild(image);
                });

                const videoBlob = await readHomeVideo();
                if (homeVideoUrl) URL.revokeObjectURL(homeVideoUrl);
                homeVideoUrl = "";
                let video = null;
                if (videoBlob instanceof Blob && videoBlob.type.startsWith("video/")) {
                    video = document.createElement("video");
                    video.src = homeVideoUrl = URL.createObjectURL(videoBlob);
                    video.autoplay = true;
                    video.muted = true;
                    video.controls = true;
                    video.playsInline = true;
                    video.preload = "auto";
                    video.setAttribute("aria-label", "Home page video");
                    imageTrack.appendChild(video);
                }

                photoWindow.hidden = photos.length === 0 && !video;
                const slideCount = photos.length + (video ? 1 : 0);
                if (video && photos.length === 0) {
                    video.play().catch(() => {
                        mediaError.textContent = "Video autoplay was blocked. Press play on the video to start it.";
                        mediaError.hidden = false;
                    });
                } else if (slideCount > 1) {
                    if (!video) {
                        const clone = imageTrack.firstElementChild.cloneNode();
                        clone.alt = "Home photo slideshow";
                        imageTrack.appendChild(clone);
                    }
                    const startPhotoTimer = () => {
                        window.clearInterval(slideTimer);
                        slideTimer = window.setInterval(() => {
                            slideIndex += 1;
                            imageTrack.style.transform = `translateX(-${slideIndex * 100}%)`;

                            if (video && slideIndex === photos.length) {
                                window.clearInterval(slideTimer);
                                slideResetTimer = window.setTimeout(() => {
                                    video.play().catch(() => {
                                        mediaError.textContent = "Video autoplay was blocked. Press play on the video to start it.";
                                        mediaError.hidden = false;
                                    });
                                }, 1000);
                            } else if (!video && slideIndex === photos.length) {
                                slideResetTimer = window.setTimeout(() => {
                                    imageTrack.style.transition = "none";
                                    imageTrack.style.transform = "translateX(0)";
                                    slideIndex = 0;
                                    requestAnimationFrame(() => requestAnimationFrame(() => {
                                        imageTrack.style.transition = "";
                                    }));
                                }, 1000);
                            }
                        }, 10000);
                    };
                    startPhotoTimer();
                    if (video && photos.length) {
                        video.addEventListener("ended", () => {
                            video.pause();
                            video.currentTime = 0;
                            imageTrack.style.transition = "none";
                            imageTrack.style.transform = "translateX(0)";
                            slideIndex = 0;
                            requestAnimationFrame(() => requestAnimationFrame(() => {
                                imageTrack.style.transition = "";
                                startPhotoTimer();
                            }));
                        });
                    }
                }
                if (video) {
                    video.addEventListener("error", () => {
                        mediaError.textContent = "The saved home video could not be played in this browser.";
                        mediaError.hidden = false;
                    });
                }
            } catch (error) {
                photoWindow.hidden = true;
                mediaError.textContent = error.message || "Unable to load home page media.";
                mediaError.hidden = false;
            }
        }

        loadHomePhotos();
    </script>
</body>
</html>
